name: Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-native/**', 'src/content.ts', 'src/engine.ts', 'scripts/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: node scripts/sync-android-assets.mjs
      - run: npx tsx scripts/generate-native-fixtures.ts
      - name: Verify native Android
        timeout-minutes: 6
        working-directory: android-native
        run: |
          gradle testDebugUnitTest lintDebug assembleDebug --console=plain &
          build_pid=$!
          (
            sleep 150
            if kill -0 "$build_pid" 2>/dev/null; then
              mkdir -p app/build/reports/thread-dumps
              jps -l | awk '/GradleWorkerMain/ { print $1 }' | while read -r worker_pid; do
                jstack "$worker_pid" > "app/build/reports/thread-dumps/worker-$worker_pid.txt" || true
              done
            fi
          ) &
          monitor_pid=$!
          result=0
          wait "$build_pid" || result=$?
          kill "$monitor_pid" 2>/dev/null || true
          exit "$result"
      - uses: actions/upload-artifact@v4
        with:
          name: Neon-Lexico-Android-preview
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-validation
          path: |
            android-native/app/build/reports/
            android-native/app/build/test-results/
